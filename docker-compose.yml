services:
  mysql:
    image: mysql:8.4
    container_name: compras-senai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: compras_senai
      MYSQL_USER: compras
      MYSQL_PASSWORD: compras
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
